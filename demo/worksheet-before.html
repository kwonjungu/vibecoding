<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🏯 우리 지역의 문화유산 학습 활동지 🏯</title>
<!--
  ============================================================
  이 파일은 "전형적인 바이브코딩 결과물" 예시입니다.
  잘 만든 예시가 아니라, AI에게 아무 디자인 지시 없이 만들라고 했을 때
  거의 항상 나오는 모습(보라색 그라데이션·둥근 카드·이모지·가운데 정렬)을
  일부러 그대로 재현한 것입니다.
  DESIGN.md를 적용해 이 파일을 다시 만들어 보는 것이 2칸 실습입니다.
  ============================================================
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 40px;
    max-width: 800px;
    width: 100%;
  }
  h1 {
    text-align: center;
    color: #667eea;
    margin-bottom: 10px;
    font-size: 2.2em;
  }
  .subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 30px;
    font-size: 1.1em;
  }
  .info-box {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 30px;
    text-align: center;
  }
  .name-row {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
  }
  .name-row input {
    flex: 1;
    padding: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1em;
  }
  .name-row input:focus { outline: none; border-color: #667eea; }
  .question-card {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
    border-left: 5px solid #667eea;
  }
  .question-card h3 { color: #333; margin-bottom: 15px; }
  .option {
    display: block;
    background: white;
    padding: 12px 18px;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.3s ease;
  }
  .option:hover { border-color: #667eea; transform: translateX(5px); }
  .option input { margin-right: 10px; }
  textarea {
    width: 100%;
    padding: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-family: inherit;
    font-size: 1em;
    resize: vertical;
    min-height: 100px;
  }
  textarea:focus { outline: none; border-color: #667eea; }
  .submit-btn {
    display: block;
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 1.2em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 30px;
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    transition: transform 0.2s ease;
  }
  .submit-btn:hover { transform: translateY(-3px); }
  .result {
    display: none;
    margin-top: 30px;
    padding: 30px;
    background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    border-radius: 15px;
    text-align: center;
    color: white;
  }
  .result h2 { font-size: 2.5em; margin-bottom: 10px; }
  .retry-btn {
    margin-top: 20px;
    padding: 12px 30px;
    background: white;
    color: #43e97b;
    border: none;
    border-radius: 10px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
  }
  footer { text-align: center; margin-top: 30px; color: #aaa; font-size: 0.9em; }
</style>
</head>
<body>
  <div class="container">
    <h1>🏯 우리 지역의 문화유산 🏯</h1>
    <p class="subtitle">✨ 4학년 사회 · 학습 활동지 ✨</p>

    <div class="info-box">
      <p>🎯 <strong>학습 목표</strong></p>
      <p>우리 지역을 대표하는 문화유산을 찾아보고, 왜 소중한지 설명할 수 있어요!</p>
    </div>

    <div class="name-row">
      <input type="text" id="cls" placeholder="👥 반을 입력하세요" />
      <input type="text" id="name" placeholder="🙋 이름을 입력하세요" />
    </div>

    <div class="question-card">
      <h3>1️⃣ 문화유산이란 무엇일까요?</h3>
      <label class="option"><input type="radio" name="q1" value="1" />옛날 사람들이 남긴 소중한 것</label>
      <label class="option"><input type="radio" name="q1" value="2" />어제 새로 지은 건물</label>
      <label class="option"><input type="radio" name="q1" value="3" />우리 집에 있는 장난감</label>
    </div>

    <div class="question-card">
      <h3>2️⃣ 다음 중 문화유산이 <u>아닌</u> 것은?</h3>
      <label class="option"><input type="radio" name="q2" value="1" />오래된 절과 탑</label>
      <label class="option"><input type="radio" name="q2" value="2" />조상들이 부르던 노래</label>
      <label class="option"><input type="radio" name="q2" value="3" />작년에 문을 연 편의점</label>
    </div>

    <div class="question-card">
      <h3>3️⃣ 문화유산을 지키는 방법으로 알맞은 것은?</h3>
      <label class="option"><input type="radio" name="q3" value="1" />낙서를 하고 이름을 새긴다</label>
      <label class="option"><input type="radio" name="q3" value="2" />함부로 만지지 않고 깨끗이 관람한다</label>
      <label class="option"><input type="radio" name="q3" value="3" />기념으로 조금씩 떼어 온다</label>
    </div>

    <div class="question-card">
      <h3>4️⃣ 우리 지역의 문화유산 한 가지를 쓰고, 왜 소중한지 설명해 보세요.</h3>
      <textarea id="essay" placeholder="✏️ 여기에 자유롭게 써 보세요..."></textarea>
    </div>

    <button class="submit-btn" onclick="checkAnswers()">🚀 제출하기 🚀</button>

    <div class="result" id="result">
      <h2 id="score">0 / 3</h2>
      <p id="message"></p>
      <button class="retry-btn" onclick="location.reload()">🔄 다시 풀기</button>
    </div>

    <footer>Made with ❤️ by AI</footer>
  </div>

<script>
  function checkAnswers() {
    const answers = { q1: '1', q2: '3', q3: '2' };
    let score = 0;
    for (const q in answers) {
      const picked = document.querySelector('input[name="' + q + '"]:checked');
      if (picked && picked.value === answers[q]) score++;
    }
    document.getElementById('score').textContent = score + ' / 3';
    const msg =
      score === 3 ? '🎉 완벽해요! 문화유산 박사님!' :
      score === 2 ? '👍 잘했어요! 조금만 더!' :
      '💪 괜찮아요! 다시 한번 해 볼까요?';
    document.getElementById('message').textContent = msg;
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
  }
</script>
</body>
</html>
